[project]
name = "rmfpapi"
version = "1.5.0+260512"
description = "Fake product RASENMAEHER integration API service"
authors = [
    { name = "Eero af Heurlin", email = "eero.afheurlin@iki.fi" },
]
license = "MIT"
readme = "README.rst"
requires-python = ">=3.11,<4.0"
dependencies = [
    "libadvian>=1.4,<2.0",
    "libpvarki>=2.1,<3.0",
    "fastapi>=0.89,<1.0",
    "pydantic>=2.0,<3.0",
    "jinja2>=3.1,<4.0",
    "uvicorn[standard]>=0.20,<1.0",
    "gunicorn>=21.0,<22.0",
]

[project.urls]
homepage = "https://github.com/pvarki/python-rasenmaeher-rmfpapi"
repository = "https://github.com/pvarki/python-rasenmaeher-rmfpapi"

[project.scripts]
rmfpapi = "rmfpapi.console:rmfpapi_cli"

[dependency-groups]
dev = [
    "pytest>=7.4,<8.0",
    "coverage>=7.3,<8.0",
    "pytest-cov>=4.1,<5.0",
    "ruff>=0.14,<1.0",
    "bandit>=1.8,<2.0",
    "mypy>=1.18,<2.0",
    "pytest-asyncio>=0.23,<1.0",
    "bump-my-version>=1.2,<2.0",
    "detect-secrets>=1.5,<2.0",
    "httpx>=0.23,<1.0",
    "tox>=4.0,<5.0",
    "tox-uv>=1.0,<2.0",
    "prek>=0.3,<1.0",
]

[[tool.uv.index]]
name = "nexuslocal"
url = "https://nexus.dev.pvarki.fi/repository/pypilocal/simple"
explicit = true

[tool.uv.sources]
libpvarki = { index = "nexuslocal" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rmfpapi"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
strict=true

[[tool.mypy.overrides]]
module="tests"
disallow_untyped_decorators=false

[tool.pytest.ini_options]
junit_family="xunit2"
addopts="--cov=rmfpapi --cov-fail-under=55 --cov-branch"
asyncio_mode="strict"

[tool.coverage.run]
omit = ["tests/*"]
branch = true
